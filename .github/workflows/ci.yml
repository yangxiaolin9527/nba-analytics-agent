name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.14'
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: node --test tests/frontend/demo-state.test.cjs

  docker-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: /tmp/nba-build-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'uv.lock', 'pyproject.toml') }}-
            docker-${{ runner.os }}-
      - name: Build replay image
        run: |
          docker buildx create --name ci-builder --driver docker-container --use
          docker buildx build --load --tag nba-analytics-agent:ci --build-arg VCS_REF=${{ github.sha }} --cache-from type=local,src=/tmp/nba-build-cache --cache-to type=local,dest=/tmp/nba-build-cache-new,mode=max .
          rm -rf /tmp/nba-build-cache
          mv /tmp/nba-build-cache-new /tmp/nba-build-cache
          printf 'services:\n  nba-agent:\n    image: nba-analytics-agent:ci\n' > /tmp/ci-compose.yaml
      - name: Check credential-free replay
        run: |
          docker compose -f compose.yaml -f /tmp/ci-compose.yaml up --no-build -d --wait --wait-timeout 90
          docker compose -f compose.yaml -f /tmp/ci-compose.yaml exec -T nba-agent python - < tests/smoke_replay.py
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down
