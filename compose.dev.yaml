# Dependency changes require a rebuild; code edits use bind mounts and reload.
services:
  nba-agent:
    volumes:
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ./static:/app/static:ro
      - ./metadata:/app/metadata:ro
      - ./reports/demo:/app/reports/demo:ro
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-dir", "/app/scripts"]
