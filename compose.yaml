services:
  nba-agent:
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-unknown}
    ports:
      - "127.0.0.1:${NBA_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
